<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIVO Sales Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033}
.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 8px 25px #1720330a}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}
.blue{background:#2563eb;color:white}.green{background:#059669;color:white}.dark{background:#111827;color:white}.red{background:#fee2e2;color:#b91c1c}
.input,.select{width:100%;padding:11px 12px;border:1px solid #dfe5ee;border-radius:11px;background:#fff;outline:none}
.input:focus,.select:focus{border-color:#6d8cff;box-shadow:0 0 0 3px #2563eb12}
label{display:block;font-size:11px;font-weight:800;color:#657085;margin-bottom:6px}
th{background:#f6f8fb;color:#718096;font-size:10px;text-transform:uppercase;text-align:left;padding:11px;white-space:nowrap}
td{padding:11px;border-bottom:1px solid #edf0f4;font-size:12px;vertical-align:top}
.item{background:#f8fafc;border:1px solid #e5eaf1;border-radius:14px;padding:13px}
.tab{padding:8px 11px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer}
.tab.active{background:#e8efff;color:#245bd8}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   1. FIREBASE
   Ganti hanya bagian ini jika memakai Firebase project baru.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBvmEm2ijndVw25OGa4q3xEFShAqIhmVGI",
  authDomain: "vivo-sales-report-baru.firebaseapp.com",
  databaseURL: "https://vivo-sales-report-baru-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vivo-sales-report-baru",
  storageBucket: "vivo-sales-report-baru.firebasestorage.app",
  messagingSenderId: "1091436558764",
  appId: "1:1091436558764:web:f9de7825ee22867a28a209"
};

/* Password admin untuk demo sederhana.
   Untuk produksi sebaiknya gunakan Firebase Authentication. */
const ADMIN_PASSWORD = "admin123";

const STORES = [
 "IMAGO MDN","IMAGO NGAWI","IMAGO JGR","IMAGO WLK","BATAM CELL",
 "NICKO CELL","JAYA UTAMA","BAJOL IJO","MURAH BERKAH","JATIM SELL",
 "HERO CELL","ILHAM CELL"
];
const PAYMENTS = ["CASH","KREDIT"];
const USERS = ["SOSMED","WALKIN"];

const PRODUCTS = [
 ["Y05e 4/64",2099000],["Y05 4/64",2299000],["Y05 4/128",2599000],
 ["Y11D 4/64",2399000],["Y11D 4/128",2799000],["Y11D 6/128",3599000],
 ["Y31D 4/128",3599000],["Y31D pro 4/128",3899000],["Y31D pro 6/128",4099000],
 ["Y31D pro 8/128",4699000],["Y31D pro 8/256",5299000],["Y500 8/128",5499000],
 ["Y500 6/256",6299000],["V60 lite 4g",5899000],["V60 lite 5g",6499000],
 ["V70fe 8/256",6999000],["V70fe 12/256",7999000],["V70 8/256",9999000],
 ["V70 12/512",10999000],["X300",0],["X300pro",0]
].map(x=>({type:x[0],price:x[1]}));

let db=null, reports={}, promotors={};
let currentUser=null, screen="login", reportItems=[];

function money(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function initFirebase(){
  if(window.firebase && firebaseConfig.apiKey!=="GANTI_API_KEY"){
    try{firebase.initializeApp(firebaseConfig);db=firebase.database();return true}catch(e){console.error(e)}
  }
  return false;
}
function options(arr,selected=""){return arr.map(x=>`<option ${x===selected?"selected":""} value="${esc(x)}">${esc(x)}</option>`).join("")}
function productOptions(){
  return PRODUCTS.map((p,i)=>`<option value="${i}">${esc(p.type)} — ${p.price?money(p.price):"Harga belum diisi"}</option>`).join("")
}

function render(){
  if(screen==="login") return renderLogin();
  if(screen==="promotor") return renderPromotor();
  if(screen==="admin") return renderAdmin();
}

function renderLogin(){
document.getElementById("app").innerHTML=`
<div class="min-h-screen grid place-items-center p-5 bg-gradient-to-br from-slate-950 via-blue-950 to-indigo-950">
 <div class="card w-full max-w-md p-7">
  <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white grid place-items-center text-2xl mb-5">V</div>
  <div class="text-xs font-black tracking-widest text-blue-600">VIVO SALES REPORT</div>
  <h1 class="text-2xl font-black mt-1">Laporan Penjualan</h1>
  <p class="text-sm text-slate-500 mt-2">Promotor registrasi terlebih dahulu, lalu input penjualan realtime.</p>
  <div class="flex gap-2 mt-6 bg-slate-100 p-1 rounded-xl">
   <button class="tab active flex-1" onclick="showLoginTab('promotor')">Promotor</button>
   <button class="tab flex-1" onclick="showLoginTab('admin')">Admin</button>
  </div>
  <div id="login-box" class="mt-5"></div>
 </div>
</div>`;
showLoginTab("promotor");
}
function showLoginTab(type){
 const box=document.getElementById("login-box"); if(!box)return;
 if(type==="admin") box.innerHTML=`
  <label>Password Admin</label><input id="adminPassword" class="input" type="password" placeholder="Password admin">
  <button class="btn dark w-full mt-3" onclick="adminLogin()">Masuk Admin</button>
  <p class="text-[10px] text-slate-400 mt-3">Password default pada file: admin123</p>`;
 else box.innerHTML=`
  <label>Nama Promotor</label><input id="promotorName" class="input" placeholder="Nama lengkap promotor">
  <button class="btn blue w-full mt-3" onclick="registerPromotor()">Registrasi / Masuk</button>
  <p class="text-[10px] text-slate-400 mt-3">Jika nama belum ada di server, sistem membuat akun promotor baru.</p>`;
}
function registerPromotor(){
 const name=(document.getElementById("promotorName").value||"").trim().replace(/\s+/g," ");
 if(!name)return alert("Nama promotor wajib diisi.");
 const key=name.toLowerCase().replace(/[.#$[\]/]/g,"_");
 const data={name,createdAt:new Date().toISOString()};
 if(db){
   db.ref("promotors/"+key).set(data).then(()=>enterPromotor(name,key)).catch(e=>alert("Gagal registrasi: "+e.message));
 }else{
   localStorage.setItem("demoPromotor",JSON.stringify(data)); enterPromotor(name,key);
 }
}
function enterPromotor(name,key){
 currentUser={role:"promotor",name,key};screen="promotor";loadReports();render();
}
function adminLogin(){
 if((document.getElementById("adminPassword").value||"")!==ADMIN_PASSWORD)return alert("Password admin salah.");
 currentUser={role:"admin"};screen="admin";loadReports();render();
}
function logout(){currentUser=null;screen="login";reportItems=[];render()}

function loadReports(){
 if(!db){reports={};promotors={};return}
 db.ref("reports").on("value",s=>{reports=s.val()||{}; if(screen==="promotor"||screen==="admin")render();});
 db.ref("promotors").on("value",s=>{promotors=s.val()||{}; if(screen==="admin")render();});
}

function renderPromotor(){
 const mine=Object.values(reports).filter(r=>r.promotorKey===currentUser.key).sort((a,b)=>b.createdAt-a.createdAt);
 document.getElementById("app").innerHTML=`
 <div class="min-h-screen">
  <header class="bg-slate-950 text-white px-5 py-4 flex justify-between items-center">
   <div><b>VIVO SALES REPORT</b><div class="text-[10px] text-slate-400">Promotor: ${esc(currentUser.name)}</div></div>
   <button class="btn bg-white/10 text-white" onclick="logout()">Keluar</button>
  </header>
  <main class="max-w-5xl mx-auto p-4 md:p-6">
   <div class="card p-5 mb-5">
    <div class="flex justify-between items-start gap-3"><div><div class="text-xs font-black text-blue-600">INPUT PENJUALAN</div><h2 class="text-xl font-black mt-1">Buat Laporan</h2><p class="text-xs text-slate-500 mt-1">Satu laporan boleh berisi lebih dari satu type HP.</p></div>
    <span class="px-3 py-2 rounded-full bg-green-50 text-green-700 text-[10px] font-bold">${db?"SERVER LIVE":"MODE DEMO"}</span></div>
    <div class="grid md:grid-cols-3 gap-3 mt-5">
      <div><label>Toko</label><select id="store" class="select">${options(STORES)}</select></div>
      <div><label>Payment Default</label><select id="paymentDefault" class="select">${options(PAYMENTS)}</select></div>
      <div><label>User Default</label><select id="userDefault" class="select">${options(USERS)}</select></div>
    </div>
    <div class="mt-5"><div class="flex justify-between items-center mb-2"><b class="text-sm">Type HP Terjual</b><button class="btn blue text-xs" onclick="addItem()">+ Tambah Type</button></div><div id="items">${renderItemRows()}</div></div>
    <button class="btn green w-full mt-4" onclick="saveReport()">Kirim Laporan</button>
   </div>
   <div class="card p-5">
    <div class="flex justify-between items-center mb-3"><h2 class="font-black">Riwayat Saya</h2><span class="text-xs text-slate-400">${mine.length} laporan</span></div>
    <div class="overflow-auto"><table class="w-full"><thead><tr><th>Waktu</th><th>Toko</th><th>Detail</th><th>Total</th></tr></thead><tbody>
    ${mine.map(r=>`<tr><td>${esc(new Date(r.createdAt).toLocaleString("id-ID"))}</td><td>${esc(r.store)}</td><td>${r.items.map(i=>`${esc(i.type)} × ${i.qty} [${i.payment}/${i.user}]`).join("<br>")}</td><td><b>${money(r.total)}</b></td></tr>`).join("")||`<tr><td colspan="4" class="text-center text-slate-400 py-8">Belum ada laporan.</td></tr>`}
    </tbody></table></div>
   </div>
  </main>
 </div>`;
}
function renderItemRows(){
 if(!reportItems.length)reportItems=[{product:0,qty:1,payment:"CASH",user:"WALKIN"}];
 return reportItems.map((x,i)=>`
 <div class="item mb-2 grid md:grid-cols-12 gap-2 items-end">
  <div class="md:col-span-5"><label>Type HP</label><select class="select" onchange="reportItems[${i}].product=+this.value">${productOptions()}</select></div>
  <div class="md:col-span-2"><label>Payment</label><select class="select" onchange="reportItems[${i}].payment=this.value">${options(PAYMENTS,x.payment)}</select></div>
  <div class="md:col-span-2"><label>User</label><select class="select" onchange="reportItems[${i}].user=this.value">${options(USERS,x.user)}</select></div>
  <div class="md:col-span-2"><label>Qty</label><input class="input" type="number" min="1" value="${x.qty}" onchange="reportItems[${i}].qty=Math.max(1,+this.value||1)"></div>
  <button class="btn red" onclick="removeItem(${i})">Hapus</button>
 </div>`).join("");
}
function addItem(){reportItems.push({product:0,qty:1,payment:document.getElementById("paymentDefault")?.value||"CASH",user:document.getElementById("userDefault")?.value||"WALKIN"});renderPromotor()}
function removeItem(i){reportItems.splice(i,1);if(!reportItems.length)reportItems.push({product:0,qty:1,payment:"CASH",user:"WALKIN"});renderPromotor()}
function saveReport(){
 const store=document.getElementById("store").value;
 const items=reportItems.map(x=>{const p=PRODUCTS[x.product];return {type:p.type,price:p.price,qty:+x.qty,payment:x.payment,user:x.user,subtotal:p.price*+x.qty}});
 if(items.some(x=>!x.price))return alert("Harga X300/X300pro belum diisi. Isi harga dulu di bagian PRODUCTS pada file.");
 const report={id:uid(),createdAt:Date.now(),promotor:currentUser.name,promotorKey:currentUser.key,store,items,total:items.reduce((s,x)=>s+x.subtotal,0)};
 if(db) db.ref("reports/"+report.id).set(report).then(()=>{alert("Laporan tersimpan.");reportItems=[];renderPromotor()}).catch(e=>alert(e.message));
 else {alert("Mode demo: laporan belum dikirim ke server. Isi Firebase Config untuk server realtime.");}
}

function renderAdmin(){
 const rs=Object.values(reports).sort((a,b)=>b.createdAt-a.createdAt);
 const totalUnit=rs.reduce((s,r)=>s+r.items.reduce((q,i)=>q+i.qty,0),0);
 const omzet=rs.reduce((s,r)=>s+r.total,0);
 const promoters=Object.values(promotors);
 document.getElementById("app").innerHTML=`
 <div class="min-h-screen">
  <header class="bg-slate-950 text-white px-5 py-4 flex justify-between items-center"><div><b>VIVO SALES REPORT</b><div class="text-[10px] text-slate-400">Admin Control Center</div></div><button class="btn bg-white/10 text-white" onclick="logout()">Keluar</button></header>
  <main class="max-w-7xl mx-auto p-4 md:p-6">
   <div class="grid md:grid-cols-3 gap-3 mb-5">
    <div class="card p-5"><div class="text-xs text-slate-400">TOTAL UNIT</div><b class="text-2xl">${totalUnit}</b></div>
    <div class="card p-5"><div class="text-xs text-slate-400">TOTAL OMSET</div><b class="text-2xl">${money(omzet)}</b></div>
    <div class="card p-5"><div class="text-xs text-slate-400">PROMOTOR TERDAFTAR</div><b class="text-2xl">${promoters.length}</b></div>
   </div>
   <div class="card p-5 mb-5">
    <div class="flex flex-wrap justify-between gap-2 items-center"><div><h2 class="font-black">Data Penjualan</h2><p class="text-xs text-slate-500">Admin dapat menarik Excel kapan saja.</p></div><button class="btn green" onclick="exportExcel()">Download Excel</button></div>
    <div class="overflow-auto mt-4"><table class="w-full"><thead><tr><th>Waktu</th><th>Promotor</th><th>Toko</th><th>Type HP</th><th>Payment</th><th>User</th><th>Qty</th><th>Harga</th><th>Omset</th><th>Aksi</th></tr></thead><tbody>
    ${rs.flatMap(r=>r.items.map((i,idx)=>`<tr><td>${esc(new Date(r.createdAt).toLocaleString("id-ID"))}</td><td>${esc(r.promotor)}</td><td>${esc(r.store)}</td><td>${esc(i.type)}</td><td>${esc(i.payment)}</td><td>${esc(i.user)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.subtotal)}</td><td><button class="btn red text-[10px]" onclick="deleteReport('${r.id}')">Hapus</button></td></tr>`)).join("")||`<tr><td colspan="10" class="text-center text-slate-400 py-8">Belum ada transaksi.</td></tr>`}
    </tbody></table></div>
   </div>
   <div class="card p-5"><h2 class="font-black">Promotor Terdaftar</h2><div class="overflow-auto mt-3"><table class="w-full"><thead><tr><th>Nama</th><th>Terdaftar</th></tr></thead><tbody>${promoters.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.createdAt?esc(new Date(p.createdAt).toLocaleString("id-ID")):"-"}</td></tr>`).join("")||`<tr><td colspan="2" class="text-center text-slate-400 py-5">Belum ada promotor.</td></tr>`}</tbody></table></div></div>
  </main>
 </div>`;
}
function deleteReport(id){
 if(!confirm("Hapus laporan ini?"))return;
 if(db)db.ref("reports/"+id).remove();
}
function exportExcel(){
 const rs=Object.values(reports).sort((a,b)=>a.createdAt-b.createdAt);
 if(!rs.length)return alert("Belum ada data.");
 const rows=[];
 rs.forEach(r=>r.items.forEach(i=>rows.push({
  "Waktu Input":new Date(r.createdAt).toLocaleString("id-ID"),
  "Nama Promotor":r.promotor,"Toko":r.store,"Type HP":i.type,
  "Payment":i.payment,"User":i.user,"Qty":i.qty,"Harga Satuan":i.price,"Omset":i.subtotal
 })));
 const wb=XLSX.utils.book_new(), ws=XLSX.utils.json_to_sheet(rows);
 ws["!cols"]=[{wch:20},{wch:25},{wch:18},{wch:22},{wch:12},{wch:12},{wch:8},{wch:16},{wch:18}];
 XLSX.utils.book_append_sheet(wb,ws,"Penjualan");
 const summary=[];
 const map={};
 rs.forEach(r=>{if(!map[r.store])map[r.store]={unit:0,omzet:0};r.items.forEach(i=>{map[r.store].unit+=i.qty;map[r.store].omzet+=i.subtotal})});
 Object.entries(map).forEach(([store,v])=>summary.push({"Toko":store,"Total Unit":v.unit,"Total Omset":v.omzet}));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),"Rekap Toko");
 XLSX.writeFile(wb,"Laporan_Penjualan_Vivo_"+new Date().toISOString().slice(0,10)+".xlsx");
}

render();
initFirebase();
</script>
</body>
</html>
